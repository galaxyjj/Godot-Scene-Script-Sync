[plugin]

name="Quick Pick Scripts"
description="切换场景页签时，脚本编辑器自动切换到当前场景根节点的脚本。方便在多个场景间快速切换编辑脚本，手动切换脚本时不会影响场景选择。

Automatically switches the script editor to the root node's script when switching scene tabs. Quickly navigate between scene scripts without manual switching. Manually changing scripts does not affect scene selection.

特别感谢 MiMo 协助完成本插件的开发与实现。
Special thanks to MiMo for the collaboration and implementation."
author="zhizhi"
version="1.0.0"
script="quick_pick_scripts.gd"
